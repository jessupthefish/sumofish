[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

# Every version is pinned once, here. Verified against crates.io/docs.rs on 2026-07-29;
# see docs/plan.md for why each was chosen and what was rejected.
[workspace.dependencies]
# --- our own crates ---
sf-model  = { path = "crates/sf-model" }
sf-theme  = { path = "crates/sf-theme" }
sf-layout = { path = "crates/sf-layout" }
sf-panels = { path = "crates/sf-panels" }
sf-board  = { path = "crates/sf-board" }
sf-term   = { path = "crates/sf-term" }
sf-sources = { path = "crates/sf-sources" }

# --- ui ---
ratatui   = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# --- chess + picture ---
shakmaty   = "0.30.1"
pgn-reader = "0.29.0"
# default-features = false drops fontdb/rustybuzz/ttf-parser/zune-jpeg/gif/webp.
# python-chess draws its coordinate labels as <path> outlines, so no font is needed.
resvg      = { version = "0.47.0", default-features = false }
icy_sixel  = "0.5.0"
base64     = "0.22"

# --- runtime + io ---
tokio        = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs", "io-util", "signal"] }
tokio-util   = { version = "0.7.19", features = ["io", "codec"] }
tokio-stream = "0.1.19"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
reqwest      = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "stream", "gzip"] }

# --- system ---
nvml-wrapper = "0.12.1"
zbus         = { version = "5.18.0", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26100.0", default-features = false, features = ["systemd1", "zbus-async-tokio"] }
rustix       = { version = "1", features = ["fs", "time"] }

# --- data ---
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml       = "1.1.4"
etcetera   = "0.11.0"
indexmap   = { version = "2", features = ["serde"] }
jiff       = "0.2"

# --- errors + logging ---
anyhow             = "1.0.104"
thiserror          = "2.0.19"
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender   = "0.2.5"

# --- dev ---
insta = "1.48.0"

[profile.release]
debug = 1        # keep line tables; a TUI panic backtrace is worth 2MB of binary
