# chess-gpu bot config.
#
# The token is NOT stored here. lichess-bot reads LICHESS_BOT_TOKEN from the
# environment and overrides this placeholder (lib/config.py:452). The systemd
# unit supplies it via EnvironmentFile from a chmod 600 file outside the repo.
token: "set-via-LICHESS_BOT_TOKEN-env-var"
url: "https://lichess.org/"

engine:
  dir: "/home/nomad/chess-gpu/bin"
  name: "sumofish-search"
  working_dir: ""
  protocol: "uci"
  ponder: false                    # Nothing to ponder with; the engine is stateless.
  debug: false

  polyglot:
    enabled: false

  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false      # The engine reports no score, so draw logic has nothing to act on.

  online_moves:
    max_out_of_book_moves: 10
    max_retries: 2
    chessdb_book:
      enabled: false
    lichess_cloud_analysis:
      enabled: false
    online_egtb:
      enabled: true                # Attacks the real weakness: it wins +20 of
      min_time: 10                 # material then shuffles to a threefold
      max_time: 10800              # because mating needs calculation it does
      max_pieces: 7                # not have. The tablebase mates for it.
      source: "lichess"
      move_quality: "best"

  lichess_bot_tbs:
    syzygy:
      enabled: false
    gaviota:
      enabled: false

  homemade_options:
  uci_options:
  engine_options:

challenge:
  concurrency: 2                   # Two at once, for throughput. #1101 (restart
                                   # loses in-progress games) gets much worse with
                                   # high concurrency, and it is closed unfixed.
  games_reserved_for_humans: 0
  sort_by: "best"
  preference: "none"
  accept_bot: true
  only_bot: false
  # 15+10 ONLY, incoming and outgoing. The engine is clock-bound: it plays
  # whatever number of simulations fits in the time it is given, and a doubling
  # of simulations was measured at +223 Elo (runs/matches/sims-800-vs-400, 240
  # games, LOS 100%). Bullet was the worst possible setting for that -- roughly
  # 0.4s a move, a few hundred simulations -- and rapid is the cheapest large
  # strength gain available, costing nothing but patience.
  #
  # It also changes what a bigger network is worth. At 0.4s a move a heavier
  # net loses more in simulations than it gains in judgement; at 30s a move
  # that trade reverses, which is why the 136M run is worth having.
  max_increment: 10
  min_increment: 10
  max_base: 900
  min_base: 900
  max_days: 14
  min_days: 1
  variants:
    - standard
  time_controls:
    - rapid                        # 15+10 lands here (900s + 40x10s ~ 22 min).
                                   # Bullet, blitz and classical are off: the
                                   # first two starve the search, and classical
                                   # buys little more than rapid while halving
                                   # the games per day.
  modes:
    - casual
    - rated                        # Now genuinely tries to win (search + a real
                                   # evaluation), so rated is legitimate -- and it
                                   # is the only way the rating ever corrects.
                                   # Lichess starts every BOT at a placeholder
                                   # 3000; casual games never move it, so
                                   # matchmaking kept picking 2500-3500 engines
                                   # and the bot went 1-19. Sandbagging means
                                   # deliberately losing; being weak is not that.
  bullet_requires_increment: true
  max_simultaneous_games_per_user: 2

greeting:
  hello: "Hi, I'm {me}. Two neural nets: one picks candidate moves, one judges positions. I search between them. Good luck!"
  goodbye: "Good game!"
  hello_spectators: "Hi, I'm {me}. A policy net proposes moves, a value net scores positions, and MCTS searches between them."
  goodbye_spectators: "Thanks for watching!"

pgn_directory: "/home/nomad/chess-gpu/logs/games"
pgn_file_grouping: "all"

matchmaking:
  allow_matchmaking: true          # Bots cannot use pools or tournaments, only
                                   # challenges. With this off SumoFish waited
                                   # for a human to find it and played exactly
                                   # zero games.
  allow_during_games: true         # Keep the queue full; do not idle between games.
  challenge_variant: "random"
  challenge_timeout: 1             # Minutes idle before challenging another bot.
                                   # The minimum, and now safe to run at.
                                   #
                                   # It was not before. Matchmaking calls
                                   # /api/user/{name} on the candidate purely to
                                   # notice that they have blocked us, and
                                   # upstream lets a failure there abort the
                                   # whole challenge. That endpoint has a small
                                   # per-IP budget, so it 429s readily, and the
                                   # bot went 40 minutes without issuing a single
                                   # challenge. patches/0002 gives that lookup
                                   # its own try/except and treats an
                                   # unavailable profile as "not blocked", so a
                                   # throttled courtesy call no longer costs a
                                   # game. Note lichess caps bot-vs-bot at ~100
                                   # games a day; at this rate that is the real
                                   # ceiling, not matchmaking.
  challenge_initial_time:          # 15+10, matching what we accept. This
    - 900                          # reverses the previous reasoning, which
  challenge_increment:             # bought 100 FAST games a day for quicker
    - 10                           # rating convergence. Convergence speed is
                                   # not the goal any more; strength is, and
                                   # the engine converts time directly into it.
                                   # Two concurrent 15+10 games is roughly 115
                                   # a day, so this still saturates lichess's
                                   # ~100 bot-vs-bot cap. Nothing is lost.
  opponent_max_rating: 2200        # KEEP, and note it resets in effect: the
                                   # bullet rating is settled (1957, RD 69) but
                                   # RAPID starts from the placeholder again,
                                   # provisional, so without this matchmaking
                                   # reads 3000 as real all over again.
                                   # Original note follows.
                                   # Hard ceiling while the 3000 placeholder is
                                   # still provisional. Without it, matchmaking
                                   # reads 3000 as real and hunts 2500-3500.
                                   # Raise or delete once ~30 rated games have
                                   # let Glicko find the true number.
  opponent_rating_difference: 500
  rating_preference: "none"
  challenge_mode: "rated"          # Outgoing challenges must be RATED too, or
                                   # the bot accepts rated games but only ever
                                   # issues casual ones, and its own matchmaking
                                   # contributes nothing to finding its rating.
  challenge_filter: "fine"

abort_time: 30
rate_limiting_delay: 0
move_overhead: 3000                # Generous. Residential connection, and the
                                   # cost of being wrong here is losing on time.
max_takebacks_accepted: 0
quit_after_all_games_finish: true  # Ctrl-C / restart drains cleanly instead of
                                   # abandoning a live game.
