[project]
name = "sumofish"
version = "0.1.0"
description = "A chess engine that evaluates positions with a transformer and does not search."
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
]

[project.optional-dependencies]
# torch is installed separately via `uv pip install torch --torch-backend=auto`
# so uv resolves the correct sm_120 wheel rather than a generic one.
train = [
    "numpy",
    "tqdm",
]

[project.scripts]
sumofish-random = "sumofish.engines.random_engine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sumofish"]
